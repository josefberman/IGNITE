[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ignite"
version = "0.1.0"
description = "Learned energetic-material generation with beam search, uncertainty, safety, and novelty"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.0",
  "numpy>=1.26.0",
  "scipy>=1.10.0",
  "pandas>=2.0.0",
  "joblib>=1.3.0",
  "rdkit>=2023.9.1",
  "xgboost>=2.0.0",
  "scikit-learn>=1.3.0",
  "sqlalchemy>=2.0.0",
  "aiosqlite>=0.19.0",
  "httpx>=0.27.0",
  "sse-starlette>=2.0.0",
  "torch>=2.1.0",
  "requests>=2.31.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0"]
ml = ["torch-geometric>=2.4.0"]
literature = [
  "openai>=1.10.0",
  "pubchempy>=1.0.4",
  "transformers>=4.36.0",
  "sentence-transformers>=2.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "ml*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
